name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your bug report 👍
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Attach some Stacktraces if any provided.
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks. You can find more detailed information in ./logs/error of you StreamlineCloud instance.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Important
      description: Make sure the issue appeared on the newest version of StreamlineCloud and you are running it on Linux. Wo dont provide support for MacOS or Windows!
      options:
        - label: Understood
          required: true
